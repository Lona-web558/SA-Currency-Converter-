<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ZAR Currency Converter</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gold: #C9A84C;
      --gold-light: #F0D080;
      --green: #00C853;
      --bg: #0A0C0F;
      --surface: #111318;
      --surface2: #181C23;
      --border: rgba(201,168,76,0.18);
      --text: #E8E6E0;
      --muted: #6B6D72;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: 0;
      pointer-events: none;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* Header */
    .site-header {
      text-align: center;
      padding: 32px 0 28px;
    }

    .flag-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(201,168,76,0.08);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 16px 6px 10px;
      margin-bottom: 18px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--gold);
      letter-spacing: 0.08em;
    }

    .flag-badge .flag { font-size: 20px; }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 10vw, 80px);
      letter-spacing: 0.06em;
      line-height: 1;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 60%, #8B6520 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-top: 8px;
      font-family: 'DM Mono', monospace;
      letter-spacing: 0.05em;
    }

    /* Input card */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .input-card::after {
      content: 'R';
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 100px;
      color: rgba(201,168,76,0.05);
      line-height: 1;
      pointer-events: none;
    }

    .input-label {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .zar-input-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .currency-tag {
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--gold);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px;
      letter-spacing: 0.1em;
      padding: 12px 16px;
      border-radius: 10px;
      white-space: nowrap;
    }

    #zarInput {
      flex: 1;
      background: var(--surface2);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--text);
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 0.05em;
      padding: 12px 18px;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    #zarInput:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.1);
    }

    #zarInput::placeholder { color: var(--muted); }

    /* Rate status bar */
    .rate-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .rate-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Search & filter */
    .controls-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    #searchInput {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 12px 14px 12px 42px;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    #searchInput:focus { border-color: var(--gold); }
    #searchInput::placeholder { color: var(--muted); }

    .region-select {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .region-select:focus { border-color: var(--gold); }
    .region-select option { background: #1a1d25; }

    /* Results grid */
    #resultsGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .currency-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color 0.2s, transform 0.15s, box-shadow 0.2s;
      cursor: default;
      animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .currency-card:hover {
      border-color: rgba(201,168,76,0.4);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }

    .card-flag {
      font-size: 28px;
      width: 40px;
      text-align: center;
      flex-shrink: 0;
    }

    .card-body { flex: 1; min-width: 0; }

    .card-code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 0.1em;
      color: var(--gold);
      line-height: 1;
    }

    .card-name {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .card-amount {
      text-align: right;
      flex-shrink: 0;
    }

    .card-value {
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }

    .card-rate {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Loading / error */
    .state-block {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(201,168,76,0.15);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result-count {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .result-count span { color: var(--gold); }

    /* Refresh btn */
    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--gold);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .refresh-btn:hover { background: rgba(201,168,76,0.08); }
    .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }

    /* Footer */
    .footer {
      text-align: center;
      margin-top: 40px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      #resultsGrid { grid-template-columns: 1fr 1fr; }
      .currency-card { flex-direction: column; align-items: flex-start; gap: 8px; }
      .card-amount { text-align: left; }
    }
  </style>
</head>

      </svg>
      <input type="text" id="searchInput" placeholder="Search currency or country…"/>

    <select class="region-select" id="regionSelect">

  <div class="result-count" id="resultCount"></div>
  <div id="resultsGrid"></div>
  <div class="footer">Powered by exchangerate-api.com &nbsp;·&nbsp; Rates update every 24h &nbsp;·&nbsp; For informational use only</div>
</div>

let zarRates = {};   // rates keyed from ZAR
let lastUpdated = null;

// ── Fetch rates ────────────────────────────────────────────────────────
async function fetchRates() {
  const btn = document.getElementById('refreshBtn');
  const icon = document.getElementById('refreshIcon');
  btn.classList.add('spinning');
  document.getElementById('rateStatus').textContent = 'Fetching live rates…';
  showLoading();

  try {
    // Free API — rates from ZAR
    const res = await fetch('https://api.exchangerate-api.com/v4/latest/ZAR');
    if (!res.ok) throw new Error('Network response not ok');
    const data = await res.json();
    zarRates = data.rates;
    lastUpdated = new Date();
    document.getElementById('rateStatus').textContent =
      `Updated ${lastUpdated.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}`;
    renderCards();

// ── Show loading skeleton ──────────────────────────────────────────────
function showLoading() {
  document.getElementById('resultsGrid').innerHTML = `
    <div class="state-block" style="grid-column:1/-1">
      <div class="spinner"></div>
      <div style="font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.06em;">Loading rates…</div>
    </div>`;
  document.getElementById('resultCount').textContent = '';
}

// ── Format number ──────────────────────────────────────────────────────
function fmt(n) {
  if (n >= 1000000) return (n/1000000).toFixed(2) + 'M';
  if (n >= 10000)   return n.toLocaleString(undefined,{maximumFractionDigits:0});
  if (n >= 100)     return n.toLocaleString(undefined,{maximumFractionDigits:2});
  if (n >= 1)       return n.toLocaleString(undefined,{maximumFractionDigits:4});
  return n.toLocaleString(undefined,{maximumFractionDigits:6});
}

// ── Render cards ──────────────────────────────────────────────────────
function renderCards() {
  const amount   = parseFloat(document.getElementById('zarInput').value) || 0;
  const search   = document.getElementById('searchInput').value.toLowerCase().trim();
  const region   = document.getElementById('regionSelect').value;
  const grid     = document.getElementById('resultsGrid');

  const filtered = Object.entries(CURRENCIES).filter(([code, info]) => {
    if (code === 'ZAR') return false;
    if (region && info.region !== region) return false;
    if (search && !code.toLowerCase().includes(search) &&
        !info.name.toLowerCase().includes(search)) return false;
    return zarRates[code] !== undefined;
  });

  document.getElementById('resultCount').innerHTML =
    `<span>${filtered.length}</span> currencies`;

  if (!filtered.length) {
    grid.innerHTML = `<div class="state-block" style="grid-column:1/-1">No currencies match your search.</div>`;
    return;
  }

  grid.innerHTML = filtered.map(([code, info], i) => {
    const rate    = zarRates[code] || 0;
    const value   = amount * rate;
    const perZar  = rate.toLocaleString(undefined,{maximumFractionDigits:6});
    return `
      <div class="currency-card" style="animation-delay:${Math.min(i*18,300)}ms">
        <div class="card-flag">${info.flag}</div>
        <div class="card-body">
          <div class="card-code">${code}</div>
          <div class="card-name">${info.name}</div>
        </div>
        <div class="card-amount">
          <div class="card-value">${fmt(value)}</div>
          <div class="card-rate">1 ZAR = ${perZar}</div>
        </div>
      </div>`;
  }).join('');
}

// ── Event listeners ────────────────────────────────────────────────────
document.getElementById('zarInput').addEventListener('input', renderCards);
document.getElementById('searchInput').addEventListener('input', renderCards);
document.getElementById('regionSelect').addEventListener('change', renderCards);

// ── Init ───────────────────────────────────────────────────────────────
fetchRates();
